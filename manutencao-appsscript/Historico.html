  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --green: #8f9b72;
      --orange: #d6aa5f;
      --red: #c07a6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 1rem 1.1rem;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; color: #d8d2c6; }
    .link-menu { display: inline-block; margin-bottom: 0.5rem; font-size: 0.78rem; color: #d8d2c6; text-decoration: none; }
    main { padding: 1rem; max-width: 560px; margin: 0 auto; padding-bottom: 3rem; }

    .campo-busca {
      width: 100%;
      font-size: 1rem;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: inherit;
      background: #fff;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .estado-carregando, .estado-vazio {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }

    .os-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
    }
    .os-card-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; gap: 0.5rem; }
    .os-card-id { font-weight: 700; font-size: 1rem; }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      color: #fff;
      white-space: nowrap;
    }
    .badge-concluida { background: var(--green); }
    .badge-cancelada { background: var(--red); }
    .os-card-setor { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.15rem; }
    .os-card-desc { font-size: 0.85rem; color: var(--text); line-height: 1.4; margin-top: 0.3rem; }
    .os-card-feito { font-size: 0.85rem; color: var(--text); line-height: 1.4; margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px dashed var(--border); }
    .os-card-rodape { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.4rem; }
    .os-card-pdf { display: inline-block; margin-top: 0.5rem; color: var(--green); font-weight: 700; font-size: 0.82rem; text-decoration: none; }

    .contador { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <a class="link-menu" href="https://script.google.com/macros/s/AKfycbxN_cFnGJpZgwVaCAegqB0HwrBsw_wKQd56wXyeq3RK5LZbumHrFaudxu9VjQMPBuOauQ/exec">‹ Menu</a>
    <h1>📜 Histórico de OS</h1>
    <p>Manutenção Mamma Mia</p>
  </header>

  <main id="app">
    <div class="estado-carregando" id="tela-carregando">Carregando…</div>
  </main>

  <script>
    var osFechadasCache = [];

    function escaparHtml(texto) {
      var div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }

    function iniciar() {
      google.script.run
        .withSuccessHandler(function (osFechadas) {
          osFechadasCache = osFechadas || [];
          renderizarTela();
        })
        .withFailureHandler(function (erro) {
          document.getElementById('app').innerHTML =
            '<div class="estado-vazio">' + escaparHtml(erro.message || String(erro)) + '</div>';
        })
        .listarOSFechadas();
    }

    function renderizarTela() {
      var app = document.getElementById('app');
      app.innerHTML =
        '<input type="text" class="campo-busca" id="campo-busca" placeholder="Buscar por OS, setor, equipamento, técnico...">' +
        '<div class="contador" id="contador"></div>' +
        '<div id="lista-resultado"></div>';

      document.getElementById('campo-busca').addEventListener('input', renderizarLista);
      renderizarLista();
    }

    function classeBadge(status) {
      return status === 'Cancelada' ? 'badge-cancelada' : 'badge-concluida';
    }

    function renderizarLista() {
      var termo = (document.getElementById('campo-busca').value || '').trim().toLowerCase();
      var lista = document.getElementById('lista-resultado');
      var contador = document.getElementById('contador');

      var filtradas = !termo
        ? osFechadasCache
        : osFechadasCache.filter(function (os) {
            return (
              (os.os || '').toLowerCase().indexOf(termo) !== -1 ||
              (os.setor || '').toLowerCase().indexOf(termo) !== -1 ||
              (os.equipamento || '').toLowerCase().indexOf(termo) !== -1 ||
              (os.tecnicoResponsavel || '').toLowerCase().indexOf(termo) !== -1 ||
              (os.assinadoPor || '').toLowerCase().indexOf(termo) !== -1 ||
              (os.descricao || '').toLowerCase().indexOf(termo) !== -1
            );
          });

      contador.textContent = filtradas.length + ' OS encontrada' + (filtradas.length === 1 ? '' : 's');

      if (filtradas.length === 0) {
        lista.innerHTML = '<div class="estado-vazio">Nenhuma OS encontrada.</div>';
        return;
      }

      lista.innerHTML = filtradas.map(function (os) {
        var rotuloStatus = os.status === 'Cancelada' ? '🚫 Cancelada' : '✅ Concluída';
        return (
          '<div class="os-card">' +
            '<div class="os-card-topo">' +
              '<span class="os-card-id">' + escaparHtml(os.os) + '</span>' +
              '<span class="badge ' + classeBadge(os.status) + '">' + rotuloStatus + '</span>' +
            '</div>' +
            '<div class="os-card-setor">' + escaparHtml(os.setor || '-') + ' · ' + escaparHtml(os.equipamento || '-') + '</div>' +
            (os.tecnicoResponsavel ? '<div class="os-card-setor">👤 Responsável: ' + escaparHtml(os.tecnicoResponsavel) + '</div>' : '') +
            '<div class="os-card-desc">' + escaparHtml(os.descricao || '') + '</div>' +
            (os.oQueFoiFeito ? '<div class="os-card-feito">' + escaparHtml(os.oQueFoiFeito) + '</div>' : '') +
            '<div class="os-card-rodape">' + escaparHtml(os.assinadoPor || '-') + ' · ' + escaparHtml(os.dataConclusao || '-') + '</div>' +
            (os.pdfFechamento ? '<a class="os-card-pdf" href="' + escaparHtml(os.pdfFechamento) + '" target="_blank">📄 Ver PDF</a>' : '') +
          '</div>'
        );
      }).join('');
    }

    iniciar();
  </script>
</body>
</html>
