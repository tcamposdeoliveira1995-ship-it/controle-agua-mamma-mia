  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --green: #8f9b72;
      --orange: #d6aa5f;
      --red: #c07a6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 1rem 1.1rem;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; color: #d8d2c6; }
    .link-menu { display: inline-block; margin-bottom: 0.5rem; font-size: 0.78rem; color: #d8d2c6; text-decoration: none; }
    main { padding: 1rem; max-width: 480px; margin: 0 auto; padding-bottom: 3rem; }

    .estado-carregando, .estado-vazio {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }

    .os-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .os-card:active { transform: scale(0.98); }
    .os-card-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .os-card-id { font-weight: 700; font-size: 1rem; }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      color: #fff;
      white-space: nowrap;
    }
    .badge-critica { background: var(--red); }
    .badge-alta { background: var(--orange); }
    .badge-media { background: #c9b25a; }
    .badge-baixa { background: var(--green); }
    .badge-outra { background: var(--text-muted); }
    .os-card-setor { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.15rem; }
    .os-card-desc { font-size: 0.85rem; color: var(--text); line-height: 1.4; }
    .aviso-peca {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold);
      background: #fbf3e4;
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 0.15rem 0.55rem;
      margin-top: 0.35rem;
    }

    .form-secao { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .form-secao label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin: 0.9rem 0 0.35rem; }
    .form-secao label:first-child { margin-top: 0; }
    textarea, select {
      width: 100%;
      font-size: 1rem;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 90px; resize: vertical; }

    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-primario { background: var(--green); color: #fff; margin-top: 1.2rem; }
    .btn-primario:disabled { opacity: 0.6; }
    .btn-secundario { background: none; color: var(--text-muted); margin-top: 0.6rem; font-weight: 600; }
    .btn-peca { background: var(--gold); color: #fff; margin-top: 0.6rem; }
    .btn-peca:disabled { opacity: 0.6; }

    .voltar { display: inline-block; margin-bottom: 0.8rem; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; }

    .alerta {
      background: #fbe9e7;
      border: 1px solid var(--red);
      color: #8c3f33;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .sucesso { text-align: center; padding: 3rem 1rem; }
    .sucesso .icone { font-size: 3rem; margin-bottom: 0.5rem; }
    .sucesso h2 { margin: 0 0 0.3rem; font-size: 1.15rem; }
    .sucesso p { color: var(--text-muted); font-size: 0.9rem; }

    input[type="file"] { display: none; }
    .btn-foto {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      border-radius: 10px;
      border: 2px dashed var(--border);
      background: #fff;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-foto.tem-foto { border-style: solid; border-color: var(--green); color: var(--green); }
    .preview-foto {
      width: 100%;
      border-radius: 10px;
      margin-top: 0.6rem;
      max-height: 260px;
      object-fit: cover;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <a class="link-menu" href="https://script.google.com/macros/s/AKfycbxN_cFnGJpZgwVaCAegqB0HwrBsw_wKQd56wXyeq3RK5LZbumHrFaudxu9VjQMPBuOauQ/exec">‹ Menu</a>
    <h1>🔧 Fechar Ordem de Serviço</h1>
    <p>Manutenção Mamma Mia</p>
  </header>

  <main id="app">
    <div class="estado-carregando" id="tela-carregando">Carregando OS abertas…</div>
  </main>

  <script>
    var osSelecionada = null;
    var listaTecnicos = [];
    var todasOSAbertas = [];
    // Persiste entre "Voltar para a lista" (não reseta ao recarregar) —
    // só muda quando o técnico troca o filtro de propósito.
    var unidadeFiltro = 'TODAS';

    function iniciar() {
      google.script.run
        .withSuccessHandler(function (osAbertas) {
          google.script.run
            .withSuccessHandler(function (tecnicos) {
              listaTecnicos = tecnicos;
              renderizarLista(osAbertas);
            })
            .withFailureHandler(mostrarErroFatal)
            .listarTecnicos();
        })
        .withFailureHandler(mostrarErroFatal)
        .listarOSAbertas();
    }

    function mostrarErroFatal(erro) {
      document.getElementById('app').innerHTML =
        '<div class="alerta">' + escaparHtml(erro.message || String(erro)) + '</div>';
    }

    function escaparHtml(texto) {
      var div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }

    function classeBadge(prioridade) {
      switch (prioridade) {
        case 'Crítica': return 'badge-critica';
        case 'Alta': return 'badge-alta';
        case 'Média': return 'badge-media';
        case 'Baixa': return 'badge-baixa';
        default: return 'badge-outra';
      }
    }

    function htmlFiltroUnidade() {
      var opcoes = ['TODAS', 'TC', 'YUKA', 'CD'];
      var rotulos = { TODAS: 'Todas', TC: 'TC', YUKA: 'YUKA', CD: 'CD' };
      return (
        '<label for="filtro-unidade" style="display:block;font-size:0.8rem;font-weight:600;color:var(--text-muted);margin-bottom:0.35rem;">Unidade</label>' +
        '<select id="filtro-unidade" style="margin-bottom:0.6rem;">' +
          opcoes.map(function (op) {
            return '<option value="' + op + '"' + (unidadeFiltro === op ? ' selected' : '') + '>' + rotulos[op] + '</option>';
          }).join('') +
        '</select>' +
        '<button class="btn btn-secundario" id="btn-gerar-pdf-lista" style="width:auto;padding:0.5rem 0.9rem;margin:0 0 1rem;display:inline-block;border:1px solid var(--border);border-radius:8px;">📄 Gerar PDF dessa lista</button>'
      );
    }

    function wireFiltroUnidade() {
      var sel = document.getElementById('filtro-unidade');
      if (sel) sel.addEventListener('change', function () { unidadeFiltro = sel.value; renderizarLista(); });
      var btnPdf = document.getElementById('btn-gerar-pdf-lista');
      if (btnPdf) btnPdf.addEventListener('click', gerarPDFListaAberta);
    }

    function gerarPDFListaAberta() {
      var btn = document.getElementById('btn-gerar-pdf-lista');
      if (!btn) return;
      btn.disabled = true;
      var textoOriginal = btn.textContent;
      btn.textContent = 'Gerando...';

      google.script.run
        .withSuccessHandler(function (resultado) {
          btn.disabled = false;
          btn.textContent = textoOriginal;
          window.open(resultado.url, '_blank');
        })
        .withFailureHandler(function (erro) {
          btn.disabled = false;
          btn.textContent = textoOriginal;
          alert('Não foi possível gerar o PDF: ' + (erro.message || String(erro)));
        })
        .gerarPDFListaOSAbertas(unidadeFiltro);
    }

    // Sem argumento (osAbertas), reaproveita todasOSAbertas — usado ao
    // trocar o filtro sem precisar buscar de novo no servidor.
    function renderizarLista(osAbertas) {
      if (osAbertas) todasOSAbertas = osAbertas;
      var app = document.getElementById('app');

      var filtradas = unidadeFiltro === 'TODAS'
        ? todasOSAbertas
        : todasOSAbertas.filter(function (os) { return os.unidade === unidadeFiltro; });

      if (!filtradas || filtradas.length === 0) {
        app.innerHTML = htmlFiltroUnidade() + '<div class="estado-vazio">✅ Nenhuma OS em aberto' + (unidadeFiltro === 'TODAS' ? ' no momento.' : ' nessa unidade.') + '</div>';
        wireFiltroUnidade();
        return;
      }

      var html = '';
      filtradas.forEach(function (os, idx) {
        html +=
          '<div class="os-card" data-idx="' + idx + '">' +
            '<div class="os-card-topo">' +
              '<span class="os-card-id">' + escaparHtml(os.os) + '</span>' +
              '<span class="badge ' + classeBadge(os.prioridade) + '">' + escaparHtml(os.prioridade || '-') + '</span>' +
            '</div>' +
            '<div class="os-card-setor">' + escaparHtml(os.setor || '-') + ' · ' + escaparHtml(os.equipamento || '-') + '</div>' +
            '<div class="os-card-desc">' + escaparHtml(os.descricao || '') + '</div>' +
            (os.status === 'Aguardando peça' ? '<div class="aviso-peca">🔩 Aguardando peça</div>' : '') +
          '</div>';
      });
      app.innerHTML = htmlFiltroUnidade() + html;
      wireFiltroUnidade();

      Array.prototype.forEach.call(app.querySelectorAll('.os-card'), function (card) {
        card.addEventListener('click', function () {
          osSelecionada = filtradas[Number(card.getAttribute('data-idx'))];
          renderizarFormulario();
        });
      });
    }

    function renderizarFormulario() {
      var app = document.getElementById('app');
      var opcoesTecnicos = listaTecnicos
        .map(function (nome) { return '<option value="' + escaparHtml(nome) + '">' + escaparHtml(nome) + '</option>'; })
        .join('');

      app.innerHTML =
        '<div class="voltar" id="btn-voltar">‹ Voltar para a lista</div>' +
        '<div class="form-secao">' +
          '<div class="os-card-topo">' +
            '<span class="os-card-id">' + escaparHtml(osSelecionada.os) + '</span>' +
            '<span class="badge ' + classeBadge(osSelecionada.prioridade) + '">' + escaparHtml(osSelecionada.prioridade || '-') + '</span>' +
          '</div>' +
          '<div class="os-card-setor">' + escaparHtml(osSelecionada.setor || '-') + ' · ' + escaparHtml(osSelecionada.equipamento || '-') + '</div>' +
          (osSelecionada.status === 'Aguardando peça' ? '<div class="aviso-peca">🔩 Aguardando peça' + (osSelecionada.necessidadePeca ? ': ' + escaparHtml(osSelecionada.necessidadePeca) : '') + '</div>' : '') +
          '<label for="campo-feito">O que foi feito?</label>' +
          '<textarea id="campo-feito" placeholder="Descreva o reparo/solução..."></textarea>' +
          '<label for="campo-assinado">Assinado por</label>' +
          '<select id="campo-assinado">' +
            '<option value="">Selecione seu nome...</option>' +
            opcoesTecnicos +
          '</select>' +
          '<label>Foto do problema resolvido</label>' +
          '<label class="btn-foto" id="btn-foto" for="campo-foto">📷 Tirar foto ou escolher da galeria</label>' +
          '<input type="file" id="campo-foto" accept="image/*">' +
          '<img class="preview-foto" id="preview-foto" alt="Prévia da foto">' +
          '<div id="area-erro"></div>' +
          '<button class="btn btn-primario" id="btn-confirmar">Confirmar baixa ✅</button>' +
          '<button class="btn btn-peca" id="btn-precisa-peca">🔩 Preciso de uma peça</button>' +
          '<button class="btn btn-secundario" id="btn-cancelar">Cancelar</button>' +
        '</div>';

      document.getElementById('btn-voltar').addEventListener('click', iniciar);
      document.getElementById('btn-cancelar').addEventListener('click', iniciar);
      document.getElementById('btn-confirmar').addEventListener('click', confirmarBaixa);
      document.getElementById('btn-precisa-peca').addEventListener('click', renderizarFormularioPeca);
      document.getElementById('campo-foto').addEventListener('change', mostrarPreviewFoto);
    }

    function renderizarFormularioPeca() {
      var app = document.getElementById('app');

      app.innerHTML =
        '<div class="voltar" id="btn-voltar-peca">‹ Voltar</div>' +
        '<div class="form-secao">' +
          '<div class="os-card-topo">' +
            '<span class="os-card-id">' + escaparHtml(osSelecionada.os) + '</span>' +
            '<span class="badge ' + classeBadge(osSelecionada.prioridade) + '">' + escaparHtml(osSelecionada.prioridade || '-') + '</span>' +
          '</div>' +
          '<div class="os-card-setor">' + escaparHtml(osSelecionada.setor || '-') + ' · ' + escaparHtml(osSelecionada.equipamento || '-') + '</div>' +
          '<label for="campo-necessidade">Qual peça você precisa?</label>' +
          '<textarea id="campo-necessidade" placeholder="Descreva a peça que falta...">' + escaparHtml(osSelecionada.necessidadePeca || '') + '</textarea>' +
          '<div id="area-erro-peca"></div>' +
          '<button class="btn btn-peca" id="btn-confirmar-peca">Enviar sinalização 🔩</button>' +
          '<button class="btn btn-secundario" id="btn-cancelar-peca">Cancelar</button>' +
        '</div>';

      document.getElementById('btn-voltar-peca').addEventListener('click', renderizarFormulario);
      document.getElementById('btn-cancelar-peca').addEventListener('click', renderizarFormulario);
      document.getElementById('btn-confirmar-peca').addEventListener('click', confirmarNecessidadePeca);
    }

    function confirmarNecessidadePeca() {
      var descricao = document.getElementById('campo-necessidade').value.trim();
      var areaErro = document.getElementById('area-erro-peca');
      var botao = document.getElementById('btn-confirmar-peca');

      areaErro.innerHTML = '';

      if (!descricao) {
        areaErro.innerHTML = '<div class="alerta">Descreva a peça que falta antes de enviar.</div>';
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Enviando...';

      google.script.run
        .withSuccessHandler(renderizarSucessoPeca)
        .withFailureHandler(function (erro) {
          botao.disabled = false;
          botao.textContent = 'Enviar sinalização 🔩';
          areaErro.innerHTML = '<div class="alerta">' + escaparHtml(erro.message || String(erro)) + '</div>';
        })
        .sinalizarNecessidadePeca(osSelecionada.os, descricao);
    }

    function renderizarSucessoPeca() {
      document.getElementById('app').innerHTML =
        '<div class="sucesso">' +
          '<div class="icone">🔩</div>' +
          '<h2>Sinalização enviada</h2>' +
          '<p>A OS ' + escaparHtml(osSelecionada.os) + ' ficou marcada como "Aguardando peça".</p>' +
          '<p>Voltando para a lista...</p>' +
        '</div>';
      setTimeout(iniciar, 2200);
    }

    function mostrarPreviewFoto() {
      var input = document.getElementById('campo-foto');
      var preview = document.getElementById('preview-foto');
      var btnFoto = document.getElementById('btn-foto');
      if (!input.files || input.files.length === 0) return;

      var leitor = new FileReader();
      leitor.onload = function () {
        preview.src = leitor.result;
        preview.style.display = 'block';
        btnFoto.textContent = '📷 Trocar foto';
        btnFoto.classList.add('tem-foto');
      };
      leitor.readAsDataURL(input.files[0]);
    }

    function confirmarBaixa() {
      var oQueFoiFeito = document.getElementById('campo-feito').value.trim();
      var assinadoPor = document.getElementById('campo-assinado').value;
      var arquivoFoto = document.getElementById('campo-foto').files[0];
      var areaErro = document.getElementById('area-erro');
      var botao = document.getElementById('btn-confirmar');

      areaErro.innerHTML = '';

      if (!oQueFoiFeito) {
        areaErro.innerHTML = '<div class="alerta">Descreva o que foi feito antes de confirmar.</div>';
        return;
      }
      if (!assinadoPor) {
        areaErro.innerHTML = '<div class="alerta">Selecione quem está assinando a baixa.</div>';
        return;
      }
      if (!arquivoFoto) {
        areaErro.innerHTML = '<div class="alerta">Tire uma foto do problema resolvido antes de confirmar.</div>';
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Enviando...';

      var leitorFoto = new FileReader();
      leitorFoto.onload = function () {
        var base64Completo = leitorFoto.result; // "data:image/jpeg;base64,AAAA..."
        var base64Dados = base64Completo.split(',')[1];

        google.script.run
          .withSuccessHandler(function (resultado) { renderizarSucesso(resultado); })
          .withFailureHandler(function (erro) {
            botao.disabled = false;
            botao.textContent = 'Confirmar baixa ✅';
            areaErro.innerHTML = '<div class="alerta">' + escaparHtml(erro.message || String(erro)) + '</div>';
          })
          .fecharOS(osSelecionada.os, oQueFoiFeito, assinadoPor, base64Dados, arquivoFoto.type);
      };
      leitorFoto.onerror = function () {
        botao.disabled = false;
        botao.textContent = 'Confirmar baixa ✅';
        areaErro.innerHTML = '<div class="alerta">Não foi possível ler a foto. Tente novamente.</div>';
      };
      leitorFoto.readAsDataURL(arquivoFoto);
    }

    function renderizarSucesso(resultado) {
      var linkPdf = resultado && resultado.pdfUrl
        ? '<p style="margin-top:0.8rem;"><a href="' + escaparHtml(resultado.pdfUrl) + '" target="_blank" style="color:var(--green);font-weight:700;text-decoration:none;">📄 Ver PDF da OS</a></p>'
        : '';
      document.getElementById('app').innerHTML =
        '<div class="sucesso">' +
          '<div class="icone">✅</div>' +
          '<h2>OS ' + escaparHtml(osSelecionada.os) + ' fechada</h2>' +
          linkPdf +
          '<p>Voltando para a lista...</p>' +
        '</div>';
      setTimeout(iniciar, 2200);
    }

    iniciar();
  </script>
</body>
</html>
