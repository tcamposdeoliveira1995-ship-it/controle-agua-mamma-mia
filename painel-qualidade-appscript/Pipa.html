<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --green: #8f9b72;
      --red: #c07a6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 1rem 1.1rem;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; color: #d8d2c6; }
    .link-menu { display: inline-block; margin-bottom: 0.5rem; font-size: 0.78rem; color: #d8d2c6; text-decoration: none; }
    main { padding: 1rem; max-width: 560px; margin: 0 auto; padding-bottom: 3rem; }

    .panel-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .panel-header h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 0.9rem; }

    .form-group { margin-bottom: 1.1rem; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-control {
      width: 100%; background: #fff; border: 1px solid var(--border); color: var(--text);
      font-family: inherit; padding: 0.65rem 0.85rem; border-radius: 10px; font-size: 0.92rem; outline: none;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .btn {
      font-family: inherit; padding: 0.65rem 1.2rem; border-radius: 10px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; border: none; width: 100%;
    }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:disabled { opacity: 0.6; }

    .estado-carregando, .estado-vazio { text-align: center; color: var(--text-muted); padding: 1rem; font-size: 0.88rem; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    table.data-table th, table.data-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    table.data-table th { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; }
  </style>
</head>
<body>
  <header>
    <a class="link-menu" href="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec">‹ Menu</a>
    <h1>🚚 Caminhão Pipa</h1>
    <p>Painel Qualidade — Mamma Mia</p>
  </header>

  <main>
    <div class="panel-card">
      <div class="panel-header"><h2>Registrar abastecimento</h2></div>
      <form id="form-pipa">
        <div class="form-group">
          <label class="form-label">Pedido (data) *</label>
          <input type="date" id="pipa-pedido" class="form-control" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Qtd. Requisitada *</label>
            <input type="number" id="pipa-requisitada" class="form-control" step="any" required>
          </div>
          <div class="form-group">
            <label class="form-label">Qtd. Recebida *</label>
            <input type="number" id="pipa-recebida" class="form-control" step="any" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Placa *</label>
          <input type="text" id="pipa-placa" class="form-control" placeholder="Ex: ABC1D23" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Relógio Início</label>
            <input type="number" id="pipa-rel-inicio" class="form-control" step="any">
          </div>
          <div class="form-group">
            <label class="form-label">Relógio Fim</label>
            <input type="number" id="pipa-rel-fim" class="form-control" step="any">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Recibo (nº)</label>
          <input type="text" id="pipa-recibo" class="form-control">
        </div>
        <button type="submit" id="btn-salvar-pipa" class="btn btn-primary">Salvar</button>
      </form>
    </div>

    <div class="panel-card">
      <div class="panel-header"><h2>Últimos registros</h2></div>
      <div id="pipa-ultimos"><div class="estado-carregando">Carregando…</div></div>
    </div>
  </main>

  <script>
    // Mesmo backend do mural de Avisos (mesma planilha de água) — só
    // ganhou uma ação nova (criar_pipa). Ver
    // docs/superpowers/specs/2026-09-23-painel-qualidade-pipa-higienizacao-design.md.
    var PIPA_EXEC_URL = 'https://script.google.com/macros/s/AKfycbzHvvPZzBDSB730gShVCl7CPQb23h37w8k8B-cY8n1RI-NkBJzp0eUP5m-rbtj3nGdwpw/exec';
    var PIPA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuFNjTMhQ3Z1QzmEXW6scCk4UkMTYRLBV0z6QSczCDZO4AyjaneybI1Xwj0LWBdNHiYf95TB6JbDHz/pub?gid=1113385596&single=true&output=csv';

    function escaparHtml(texto) {
      var div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }

    function parseCSVRobusto(texto) {
      var linhas = [];
      var rows = texto.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        if (row.trim() === '') continue;
        var campos = [];
        var i = 0;
        while (i < row.length) {
          if (row[i] === '"') {
            var val = '';
            i++;
            while (i < row.length) {
              if (row[i] === '"' && row[i + 1] === '"') { val += '"'; i += 2; }
              else if (row[i] === '"') { i++; break; }
              else { val += row[i++]; }
            }
            campos.push(val.trim());
            if (row[i] === ',') i++;
          } else {
            var val2 = '';
            while (i < row.length && row[i] !== ',') val2 += row[i++];
            campos.push(val2.trim());
            if (row[i] === ',') i++;
          }
        }
        linhas.push(campos);
      }
      return linhas;
    }

    function carregarUltimos() {
      var container = document.getElementById('pipa-ultimos');
      fetch(PIPA_CSV_URL, { cache: 'no-store' })
        .then(function(resposta) { return resposta.text(); })
        .then(function(csv) {
          var linhas = parseCSVRobusto(csv);
          if (linhas.length < 2) { container.innerHTML = '<p class="estado-vazio">Nenhum registro ainda.</p>'; return; }
          var cab = linhas[0].map(function(c) { return c.toUpperCase(); });
          var idxPedido = cab.findIndex(function(c) { return c.indexOf('PEDIDO') !== -1; });
          var idxPlaca = cab.findIndex(function(c) { return c.indexOf('PLACA') !== -1; });
          var idxRec = cab.findIndex(function(c) { return c.indexOf('RECEBIDA') !== -1 || c.indexOf('QTD_REC') !== -1; });
          var ultimos = linhas.slice(1).filter(function(l) { return !l.every(function(c) { return c === ''; }); }).slice(-5).reverse();
          if (ultimos.length === 0) { container.innerHTML = '<p class="estado-vazio">Nenhum registro ainda.</p>'; return; }
          var linhasHtml = ultimos.map(function(cols) {
            return '<tr><td>' + escaparHtml(idxPedido >= 0 ? cols[idxPedido] : '-') + '</td>' +
              '<td>' + escaparHtml(idxPlaca >= 0 ? cols[idxPlaca] : '-') + '</td>' +
              '<td>' + escaparHtml(idxRec >= 0 ? cols[idxRec] : '-') + '</td></tr>';
          }).join('');
          container.innerHTML = '<table class="data-table"><thead><tr><th>Pedido</th><th>Placa</th><th>Recebida</th></tr></thead><tbody>' + linhasHtml + '</tbody></table>';
        })
        .catch(function() { container.innerHTML = '<p class="estado-vazio">Não foi possível carregar.</p>'; });
    }

    document.getElementById('form-pipa').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('btn-salvar-pipa');
      var payload = {
        acao: 'criar_pipa',
        pedido: document.getElementById('pipa-pedido').value,
        requisitada: document.getElementById('pipa-requisitada').value,
        recebida: document.getElementById('pipa-recebida').value,
        placa: document.getElementById('pipa-placa').value.trim(),
        relInicio: document.getElementById('pipa-rel-inicio').value,
        relFim: document.getElementById('pipa-rel-fim').value,
        recibo: document.getElementById('pipa-recibo').value.trim(),
      };
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      fetch(PIPA_EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      })
        .then(function(resposta) { return resposta.json(); })
        .then(function(resultado) {
          if (!resultado.ok) throw new Error(resultado.erro || 'Erro desconhecido');
          document.getElementById('form-pipa').reset();
          carregarUltimos();
          alert('Abastecimento registrado!');
        })
        .catch(function(erro) {
          alert('Erro ao salvar: ' + erro.message);
        })
        .finally(function() {
          btn.disabled = false;
          btn.textContent = 'Salvar';
        });
    });

    carregarUltimos();
  </script>
</body>
</html>
