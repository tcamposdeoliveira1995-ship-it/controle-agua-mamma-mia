<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --green: #8f9b72;
      --red: #c07a6c;
      --orange: #d6aa5f;
      /* Aliases — o formulário abaixo foi portado quase ao pé da letra do
         Mamma Mia Control (src/auditoria.js original), que usa esses nomes
         de variável. Em vez de reescrever cada estilo inline, só aponta
         esses nomes pra paleta já usada nas outras telas deste app
         (Index.html/AbrirOS.html/Menu.html/Compras.html/Insumos.html) —
         evita qualquer risco de mudar sem querer o comportamento testado
         do checklist/NC/assinatura ao portar. */
      --card-border: var(--border);
      --text-secondary: var(--text-muted);
      --text-primary: var(--text);
      --color-green: var(--green);
      --color-red: var(--red);
      --color-orange: var(--orange);
      --color-blue: var(--gold);
      --border-radius-sm: 8px;
      --border-radius-md: 10px;
      --font-main: inherit;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 1rem 1.1rem;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; color: #d8d2c6; }
    .link-menu { display: inline-block; margin-bottom: 0.5rem; font-size: 0.78rem; color: #d8d2c6; text-decoration: none; }
    main { padding: 1rem; max-width: 760px; margin: 0 auto; padding-bottom: 3rem; }

    .panel-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .panel-header h2 { font-size: 1.15rem; font-weight: 700; margin: 0; }
    .panel-header h3 { font-size: 1rem; font-weight: 700; margin: 0; }

    .form-group { margin-bottom: 1.1rem; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .form-control {
      width: 100%;
      background: #fff;
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      font-family: var(--font-main);
      padding: 0.65rem 0.85rem;
      border-radius: var(--border-radius-md);
      font-size: 0.92rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--color-blue); }
    textarea.form-control { resize: vertical; }

    .btn {
      font-family: var(--font-main);
      padding: 0.6rem 1.1rem;
      border-radius: var(--border-radius-md);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border: none;
      text-decoration: none;
    }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:disabled { opacity: 0.6; }
    .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--card-border); }

    .estado-carregando, .estado-vazio {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 1rem;
      font-size: 0.95rem;
    }

    .modal-overlay-manual {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 1000; align-items: center;
      justify-content: center; padding: 1rem;
    }
    .modal-content { background: var(--card-bg); border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-header h3 { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 0; width: 32px; height: 32px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }

    .modern-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .modern-table th, .modern-table td { padding: 8px 10px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--card-border); }
    .modern-table th { background: #f3ede3; font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); }

    .aud-item { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: rgba(255,255,255,0.5); border-radius: var(--border-radius-md); border: 1px solid var(--card-border); gap: 1rem; flex-wrap: wrap; }
    .aud-btn-conf, .aud-btn-nc { padding: 0.4rem 0.9rem; border-radius: var(--border-radius-sm); background: transparent; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .aud-btn-conf { border: 2px solid var(--color-green); color: var(--color-green); }
    .aud-btn-nc { border: 2px solid var(--color-red); color: var(--color-red); }

    .resultado-opcao { flex: 1; min-width: 160px; padding: 1.1rem; border-radius: var(--border-radius-md); border: 2px solid var(--card-border); text-align: center; opacity: 0.4; }
  </style>
</head>

    // CHECKLIST
    // =============================================================

    function _renderChecklist() {
      var areas = {};
      AUDITORIA_ESTRUTURA.forEach(function(sec) {
        if (!areas[sec.area]) areas[sec.area] = [];
        areas[sec.area].push(sec);
      });
      var html = '';
      Object.keys(areas).forEach(function(area) {
        var secoes = areas[area];
        html += '<div class="panel-card">' +
          '<div class="panel-header" style="margin-bottom:1rem;">' +
            '<h3>' + secoes[0].icone + ' ' + area + '</h3>' +
            '<div style="display:flex; gap:0.5rem; font-size:0.75rem;">' +
              '<span class="aud-area-conf" data-area="' + area + '" style="color:var(--color-green); font-weight:700;">0 ✅</span>' +
              '<span style="color:var(--text-muted);">/</span>' +
              '<span class="aud-area-total" data-area="' + area + '" style="color:var(--text-muted);">0 itens</span>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex; flex-direction:column; gap:1.1rem;">';
        secoes.forEach(function(sec) {
          if (sec.subarea !== sec.area) {
            html += '<p style="font-size:0.8rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.05em; margin-bottom:0.25rem;">' + sec.subarea + '</p>';
          }
          html += '<div style="display:flex; flex-direction:column; gap:0.5rem;">';
          sec.itens.forEach(function(item) {
            html += '<div class="aud-item" data-id="' + item.id + '" data-area="' + area + '">' +
              '<span style="font-size:0.9rem; color:var(--text-primary); flex:1;">' + item.label + '</span>' +
              '<div style="display:flex; gap:0.5rem; flex-shrink:0;">' +
                '<button class="aud-btn-conf" data-id="' + item.id + '" type="button">✅ Conforme</button>' +
                '<button class="aud-btn-nc" data-id="' + item.id + '" type="button">❌ N/C</button>' +
              '</div>' +
            '</div>';
          });
          html += '</div>';
        });
        html += '</div></div>';
      });
      return html;
    }

    // =============================================================
    // HISTÓRICO LOCAL (só o histórico deste app — não mostra a nuvem;
    // o histórico com todas as unidades fica só no Mamma Mia Control)
    // =============================================================

    function _renderHistorico() {
      if (_state.historico.length === 0) {
        return '<div class="panel-card" style="text-align:center; padding:2.5rem 1rem;">' +
          '<div style="font-size:2.5rem; margin-bottom:0.75rem;">📋</div>' +
          '<h3 style="color:var(--text-muted); font-weight:600;">Nenhuma auditoria registrada por aqui ainda</h3>' +
        '</div>';
      }
      var lista = _state.historico.slice().reverse();
      var icones = { aprovado: '✅', ressalvas: '⚠️', reprovado: '❌' };
      var turnos = Array.from(new Set(lista.map(function(a) { return a.turno; }).filter(Boolean)));
      var rows = lista.map(function(a) {
        var nc = Object.keys(a.naoConformidades || {}).length;
        var altas = Object.values(a.naoConformidades || {}).filter(function(n) { return n.criticidade === 'alta'; }).length;
        return '<tr class="aud-hist-row" data-turno="' + (a.turno || '') + '" data-data="' + (a.data || '') + '" data-nc="' + nc + '">' +
          '<td>' + (a.dataHora || '—') + '</td>' +
          '<td>' + (a.turno || '—') + '</td>' +
          '<td>' + (a.auditor || '—') + '</td>' +
          '<td style="text-align:center;">' + nc + (altas > 0 ? ' <span style="color:var(--color-red); font-size:0.75rem;">(' + altas + ' alta' + (altas > 1 ? 's' : '') + ')</span>' : '') + '</td>' +
          '<td style="text-align:center; font-size:1.1rem;">' + (icones[a.resultado] || '—') + '</td>' +
          '<td style="text-align:center; display:flex; gap:0.25rem; justify-content:center;">' +
            '<button class="btn btn-secondary aud-btn-ver" data-id="' + a.id + '" style="padding:0.3rem 0.6rem; font-size:0.78rem;">👁️ Ver</button>' +
            '<button class="btn btn-primary aud-btn-pdf-local" data-id="' + a.id + '" style="padding:0.3rem 0.6rem; font-size:0.78rem;">📄 PDF</button>' +
          '</td>' +
        '</tr>';
      }).join('');
      return '<div class="panel-card">' +
        '<div class="panel-header"><h3>📋 Histórico deste aparelho (YUKA)</h3><span style="color:var(--text-muted); font-size:0.82rem;">' + lista.length + ' registros</span></div>' +
        '<div style="display:flex; gap:0.6rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem;">' +
          '<div class="form-group" style="margin:0; flex:1; min-width:130px;"><label class="form-label" style="font-size:0.78rem;">Data inicial</label><input type="date" id="aud-local-filtro-de" class="form-control" style="font-size:0.82rem;"></div>' +
          '<div class="form-group" style="margin:0; flex:1; min-width:130px;"><label class="form-label" style="font-size:0.78rem;">Data final</label><input type="date" id="aud-local-filtro-ate" class="form-control" style="font-size:0.82rem;"></div>' +
          '<div class="form-group" style="margin:0; flex:1; min-width:130px;"><label class="form-label" style="font-size:0.78rem;">Turno</label><select id="aud-local-filtro-turno" class="form-control" style="font-size:0.82rem;"><option value="">Todos</option>' + turnos.map(function(t) { return '<option value="' + t + '">' + t + '</option>'; }).join('') + '</select></div>' +
          '<div class="form-group" style="margin:0; flex:1; min-width:110px;"><label class="form-label" style="font-size:0.78rem;">Com N/C</label><select id="aud-local-filtro-nc" class="form-control" style="font-size:0.82rem;"><option value="">Todas</option><option value="sim">Com N/C</option><option value="nao">Sem N/C</option></select></div>' +
          '<button id="aud-local-btn-filtrar" class="btn btn-secondary" type="button" style="font-size:0.82rem; white-space:nowrap;">🔎 Filtrar</button>' +
          '<button id="aud-local-btn-pdf" class="btn btn-primary" type="button" style="font-size:0.82rem; white-space:nowrap;">📄 Gerar PDF</button>' +
        '</div>' +
        '<div style="overflow-x:auto;"><table class="modern-table" id="aud-local-tabela">' +
          '<thead><tr><th>Data/Hora</th><th>Turno</th><th>Auditor</th><th style="text-align:center;">N/C</th><th style="text-align:center;">Resultado</th><th style="text-align:center;">Ações</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>' +
      '</div>';
    }

    // =============================================================
    // BIND EVENTOS
    // =============================================================

    function _bindEventos() {
      document.querySelectorAll('.aud-btn-conf').forEach(function(btn) {
        btn.addEventListener('click', function() { _check(btn.dataset.id, 'conforme'); });
      });
      document.querySelectorAll('.aud-btn-nc').forEach(function(btn) {
        btn.addEventListener('click', function() { _check(btn.dataset.id, 'nao_conforme'); });
      });

      document.getElementById('aud-btn-historico')?.addEventListener('click', function() {
        _state.historicoAberto = !_state.historicoAberto;
        var secHist = document.getElementById('aud-secao-historico');
        var secForm = document.getElementById('aud-secao-formulario');
        var btnNova = document.getElementById('aud-btn-nova');
        var btnHist = document.getElementById('aud-btn-historico');
        if (_state.historicoAberto) {
          secHist.style.display = '';
          secForm.style.display = 'none';
          btnNova.style.display = '';
          if (btnHist) btnHist.innerHTML = '✖️ Fechar Histórico';
          secHist.innerHTML = _renderHistorico();
          _bindEventosHistorico();
        } else {
          secHist.style.display = 'none';
          secForm.style.display = '';
          btnNova.style.display = 'none';
          if (btnHist) btnHist.innerHTML = '📜 Histórico';
        }
      });

      document.getElementById('aud-btn-nova')?.addEventListener('click', function() {
        _state.historicoAberto = false;
        document.getElementById('aud-secao-historico').style.display = 'none';
        document.getElementById('aud-secao-formulario').style.display = '';
        document.getElementById('aud-btn-nova').style.display = 'none';
        var btnHist = document.getElementById('aud-btn-historico');
        if (btnHist) btnHist.innerHTML = '📜 Histórico';
      });

      document.getElementById('aud-btn-fechar-nc')?.addEventListener('click', _fecharNC);
      document.getElementById('aud-btn-cancelar-nc')?.addEventListener('click', _fecharNC);
      document.getElementById('aud-btn-salvar-nc')?.addEventListener('click', _salvarNC);

      var fotoDrop = document.getElementById('aud-nc-foto-drop');
      var fotoInput = document.getElementById('aud-nc-foto-input');
      if (fotoDrop && fotoInput) {
        fotoDrop.addEventListener('click', function() { fotoInput.click(); });
        fotoInput.addEventListener('change', function(e) { var f = e.target.files[0]; if (f) _processarFoto(f); });
      }
      document.getElementById('aud-nc-foto-remover')?.addEventListener('click', function() {
        document.getElementById('aud-nc-foto-input').value = '';
        document.getElementById('aud-nc-foto-preview').style.display = 'none';
        document.getElementById('aud-nc-foto-drop').style.display = '';
        window._audFotoBase64 = null;
      });

      document.getElementById('aud-btn-limpar')?.addEventListener('click', function() {
        if (confirm('Tem certeza que deseja limpar todo o formulário?')) {
          _state.respostas = {};
          _state.naoConformidades = {};
          _state.assinatura = null;
          _renderTudo();
          _toast('Formulário limpo.', 'info');
        }
      });

      document.getElementById('aud-btn-finalizar')?.addEventListener('click', _finalizar);
      document.getElementById('aud-btn-fechar-ver')?.addEventListener('click', _fecharVer);
      document.getElementById('aud-btn-fechar-ver2')?.addEventListener('click', _fecharVer);
      document.getElementById('aud-btn-imprimir')?.addEventListener('click', function() {
        var id = document.getElementById('aud-modal-ver-conteudo')?.dataset.audId;
        if (id) {
          var aud = _state.historico.find(function(a) { return a.id === id; });
          if (aud) { _fecharVer(); _gerarPDFAuditoria(aud); return; }
        }
        window.print();
      });
    }

    function _bindEventosHistorico() {
      document.querySelectorAll('.aud-btn-ver').forEach(function(b) {
        b.addEventListener('click', function() {
          var aud = _state.historico.find(function(a) { return a.id === b.dataset.id; });
          if (aud) _abrirVer(aud);
        });
      });
      document.querySelectorAll('.aud-btn-pdf-local').forEach(function(b) {
        b.addEventListener('click', function() {
          var aud = _state.historico.find(function(a) { return a.id === b.dataset.id; });
          if (aud) _gerarPDFAuditoria(aud);
        });
      });

      document.getElementById('aud-local-btn-filtrar')?.addEventListener('click', function() {
        var de = document.getElementById('aud-local-filtro-de')?.value;
        var ate = document.getElementById('aud-local-filtro-ate')?.value;
        var turno = document.getElementById('aud-local-filtro-turno')?.value;
        var nc = document.getElementById('aud-local-filtro-nc')?.value;
        document.querySelectorAll('.aud-hist-row').forEach(function(row) {
          var mostrar = true;
          if (de && row.dataset.data) {
            var partes = row.dataset.data.split('/');
            if (partes.length === 3) {
              var dataRow = new Date(partes[2] + '-' + partes[1] + '-' + partes[0]);
              if (dataRow < new Date(de)) mostrar = false;
            }
          }
          if (ate && row.dataset.data) {
            var partes2 = row.dataset.data.split('/');
            if (partes2.length === 3) {
              var dataRow2 = new Date(partes2[2] + '-' + partes2[1] + '-' + partes2[0]);
              var fim = new Date(ate); fim.setHours(23,59,59,999);
              if (dataRow2 > fim) mostrar = false;
            }
          }
          if (turno && row.dataset.turno !== turno) mostrar = false;
          if (nc === 'sim' && Number(row.dataset.nc) === 0) mostrar = false;
          if (nc === 'nao' && Number(row.dataset.nc) > 0) mostrar = false;
          row.style.display = mostrar ? '' : 'none';
        });
      });

      document.getElementById('aud-local-btn-pdf')?.addEventListener('click', function() {
        var de = document.getElementById('aud-local-filtro-de')?.value;
        var ate = document.getElementById('aud-local-filtro-ate')?.value;
        var turno = document.getElementById('aud-local-filtro-turno')?.value;
        var nc = document.getElementById('aud-local-filtro-nc')?.value;
        var lista = _state.historico.slice().reverse();
        if (de) lista = lista.filter(function(a) {
          var partes = (a.data || '').split('/');
          if (partes.length < 3) return true;
          return new Date(partes[2] + '-' + partes[1] + '-' + partes[0]) >= new Date(de);
        });
        if (ate) lista = lista.filter(function(a) {
          var partes = (a.data || '').split('/');
          if (partes.length < 3) return true;
          var fim = new Date(ate); fim.setHours(23,59,59,999);
          return new Date(partes[2] + '-' + partes[1] + '-' + partes[0]) <= fim;
        });
        if (turno) lista = lista.filter(function(a) { return a.turno === turno; });
        if (nc === 'sim') lista = lista.filter(function(a) { return Object.keys(a.naoConformidades || {}).length > 0; });
        if (nc === 'nao') lista = lista.filter(function(a) { return Object.keys(a.naoConformidades || {}).length === 0; });
        _gerarPDFResumoLocal(lista);
      });
    }

    // =============================================================
    // LÓGICA DE CHECK
    // =============================================================

    function _check(itemId, tipo) {
      if (_state.respostas[itemId] === tipo) {
        delete _state.respostas[itemId];
        delete _state.naoConformidades[itemId];
        _visualizarItem(itemId, null);
      } else {
        _state.respostas[itemId] = tipo;
        if (tipo === 'nao_conforme') {
          delete _state.naoConformidades[itemId];
          _abrirNC(itemId);
        } else {
          delete _state.naoConformidades[itemId];
        }
        _visualizarItem(itemId, tipo);
      }
      _atualizarResultado();
      _atualizarContadores();
      _atualizarResumoNCs();
    }

    function _visualizarItem(itemId, tipo) {
      var el = document.querySelector('.aud-item[data-id="' + itemId + '"]');
      if (!el) return;
      var btnC = el.querySelector('.aud-btn-conf');
      var btnN = el.querySelector('.aud-btn-nc');
      if (btnC) { btnC.style.background = 'transparent'; btnC.style.color = 'var(--color-green)'; }
      if (btnN) { btnN.style.background = 'transparent'; btnN.style.color = 'var(--color-red)'; }
      el.style.background = 'rgba(255,255,255,0.5)';
      if (tipo === 'conforme') {
        if (btnC) { btnC.style.background = 'var(--color-green)'; btnC.style.color = 'white'; }
        el.style.background = 'rgba(143,155,114,0.12)';
      } else if (tipo === 'nao_conforme') {
        if (btnN) { btnN.style.background = 'var(--color-red)'; btnN.style.color = 'white'; }
        el.style.background = 'rgba(192,122,108,0.12)';
      }
    }

    function _atualizarContadores() {
      var mapa = {};
      AUDITORIA_ESTRUTURA.forEach(function(sec) {
        sec.itens.forEach(function(item) {
          if (!mapa[sec.area]) mapa[sec.area] = { total: 0, conf: 0 };
          mapa[sec.area].total++;
          if (_state.respostas[item.id] === 'conforme') mapa[sec.area].conf++;
        });
      });
      Object.keys(mapa).forEach(function(area) {
        var c = mapa[area];
        var elC = document.querySelector('.aud-area-conf[data-area="' + area + '"]');
        var elT = document.querySelector('.aud-area-total[data-area="' + area + '"]');
        if (elC) elC.textContent = c.conf + ' ✅';
        if (elT) elT.textContent = c.total + ' itens';
      });
    }

    function _atualizarResumoNCs() {
      var resumo = document.getElementById('aud-nc-resumo');
      var lista = document.getElementById('aud-nc-lista');
      var count = document.getElementById('aud-nc-count');
      var ncs = _state.naoConformidades;
      var ids = Object.keys(ncs);
      if (!resumo || !lista) return;
      if (ids.length === 0) { resumo.style.display = 'none'; return; }
      resumo.style.display = '';
      if (count) count.textContent = ids.length;
      var ic = { baixa: '🟢', media: '🟡', alta: '🔴' };
      lista.innerHTML = ids.map(function(id) {
        var nc = ncs[id];
        var label = id;
        for (var i = 0; i < AUDITORIA_ESTRUTURA.length; i++) {
          var f = AUDITORIA_ESTRUTURA[i].itens.find(function(it) { return it.id === id; });
          if (f) { label = AUDITORIA_ESTRUTURA[i].subarea + ' → ' + f.label; break; }
        }
        return '<div style="padding:0.7rem 0.9rem; border-radius:var(--border-radius-sm); border:1px solid var(--card-border); margin-bottom:0.5rem; background:rgba(192,122,108,0.08);">' +
          '<div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">' +
            '<span>' + (ic[nc.criticidade] || '⚠️') + '</span><strong style="font-size:0.88rem;">' + label + '</strong>' +
            (nc.gerarOS ? '<span style="font-size:0.72rem; background:var(--color-blue); color:white; border-radius:10px; padding:1px 7px;">OS</span>' : '') +
          '</div>' +
          '<p style="color:var(--text-secondary); font-size:0.8rem; margin-top:0.3rem;">' + nc.descricao + '</p>' +
        '</div>';
      }).join('');
    }

    function _calcularResultado() {
      var ncs = Object.values(_state.naoConformidades);
      if (ncs.filter(function(n) { return n.criticidade === 'alta'; }).length > 0 || ncs.length >= 4) return 'reprovado';
      if (ncs.length > 0) return 'ressalvas';
      return 'aprovado';
    }

    function _atualizarResultado() {
      var res = _calcularResultado();
      var cores = { aprovado: 'var(--color-green)', ressalvas: 'var(--color-orange)', reprovado: 'var(--color-red)' };
      document.querySelectorAll('.resultado-opcao').forEach(function(el) {
        var r = el.dataset.resultado;
        if (r === res) {
          el.style.opacity = '1'; el.style.borderColor = cores[r]; el.style.boxShadow = '0 0 0 2px ' + cores[r] + '40';
        } else {
          el.style.opacity = '0.35'; el.style.borderColor = 'var(--card-border)'; el.style.boxShadow = 'none';
        }
      });
    }

    // =============================================================
    // MODAL NC
    // =============================================================

    function _abrirNC(itemId) {
      _ncItemIdPendente = itemId;
      var label = itemId;
      for (var i = 0; i < AUDITORIA_ESTRUTURA.length; i++) {
        var f = AUDITORIA_ESTRUTURA[i].itens.find(function(it) { return it.id === itemId; });
        if (f) { label = AUDITORIA_ESTRUTURA[i].icone + ' ' + AUDITORIA_ESTRUTURA[i].subarea + ' → ' + f.label; break; }
      }
      document.getElementById('aud-nc-label').textContent = label;
      document.getElementById('aud-nc-descricao').value = '';
      document.getElementById('aud-nc-acao').value = '';
      document.getElementById('aud-nc-gerar-os').checked = false;
      document.querySelectorAll('input[name="aud-nc-criticidade"]').forEach(function(r) { r.checked = false; });
      document.getElementById('aud-nc-foto-input').value = '';
      document.getElementById('aud-nc-foto-preview').style.display = 'none';
      document.getElementById('aud-nc-foto-drop').style.display = '';
      window._audFotoBase64 = null;
      var nc = _state.naoConformidades[itemId];
      if (nc) {
        document.getElementById('aud-nc-descricao').value = nc.descricao || '';
        document.getElementById('aud-nc-acao').value = nc.acao || '';
        document.getElementById('aud-nc-gerar-os').checked = !!nc.gerarOS;
        var radio = document.querySelector('input[name="aud-nc-criticidade"][value="' + nc.criticidade + '"]');
        if (radio) radio.checked = true;
        if (nc.foto) {
          window._audFotoBase64 = nc.foto;
          document.getElementById('aud-nc-foto-img').src = nc.foto;
          document.getElementById('aud-nc-foto-preview').style.display = '';
          document.getElementById('aud-nc-foto-drop').style.display = 'none';
        }
      }
      var modal = document.getElementById('aud-modal-nc');
      if (modal) modal.style.display = 'flex';
    }

    function _fecharNC() {
      var modal = document.getElementById('aud-modal-nc');
      if (modal) modal.style.display = 'none';
      if (_ncItemIdPendente && !_state.naoConformidades[_ncItemIdPendente]) {
        delete _state.respostas[_ncItemIdPendente];
        _visualizarItem(_ncItemIdPendente, null);
        _atualizarResultado();
        _atualizarContadores();
      }
      _ncItemIdPendente = null;
    }

    function _salvarNC() {
      if (!_ncItemIdPendente) return;
      var descricao = document.getElementById('aud-nc-descricao').value.trim();
      var acao = document.getElementById('aud-nc-acao').value.trim();
      var radio = document.querySelector('input[name="aud-nc-criticidade"]:checked');
      if (!descricao) { _toast('Informe a descrição da ocorrência.', 'error'); return; }
      if (!window._audFotoBase64) { _toast('A foto é obrigatória para não conformidades.', 'error'); return; }
      if (!radio) { _toast('Selecione o grau de criticidade.', 'error'); return; }
      if (!acao) { _toast('Informe a ação corretiva imediata.', 'error'); return; }
      _state.naoConformidades[_ncItemIdPendente] = {
        descricao: descricao, foto: window._audFotoBase64, criticidade: radio.value, acao: acao,
        gerarOS: document.getElementById('aud-nc-gerar-os').checked
      };
      var modal = document.getElementById('aud-modal-nc');
      if (modal) modal.style.display = 'none';
      _ncItemIdPendente = null;
      _atualizarResumoNCs();
      _atualizarResultado();
      _toast('Não conformidade registrada.', 'success');
    }

    function _processarFoto(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        window._audFotoBase64 = e.target.result;
        var img = document.getElementById('aud-nc-foto-img');
        if (img) img.src = e.target.result;
        document.getElementById('aud-nc-foto-preview').style.display = '';
        document.getElementById('aud-nc-foto-drop').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // =============================================================
    // CANVAS ASSINATURA
    // =============================================================

    function _bindCanvas() {
      var canvas = document.getElementById('aud-assinatura-canvas');
      if (!canvas) return;
      var ratio = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      var ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      ctx.strokeStyle = '#4b433c'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      var desenhando = false;
      function pos(e) {
        var r = canvas.getBoundingClientRect();
        if (e.touches) return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      canvas.addEventListener('mousedown', function(e) { e.preventDefault(); desenhando = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      canvas.addEventListener('mousemove', function(e) { if (!desenhando) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); _marcarAssinatura(); });
      canvas.addEventListener('mouseup', function() { desenhando = false; _salvarAssinatura(canvas); });
      canvas.addEventListener('mouseleave', function() { desenhando = false; _salvarAssinatura(canvas); });
      canvas.addEventListener('touchstart', function(e) { e.preventDefault(); desenhando = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }, { passive: false });
      canvas.addEventListener('touchmove', function(e) { if (!desenhando) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); _marcarAssinatura(); }, { passive: false });
      canvas.addEventListener('touchend', function() { desenhando = false; _salvarAssinatura(canvas); });
      document.getElementById('aud-btn-limpar-assinatura')?.addEventListener('click', function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        _state.assinatura = null;
        var st = document.getElementById('aud-assinatura-status');
        if (st) { st.textContent = 'Área de assinatura vazia'; st.style.color = 'var(--text-muted)'; }
      });
    }

    function _marcarAssinatura() {
      var st = document.getElementById('aud-assinatura-status');
      if (st) { st.textContent = 'Assinatura capturada ✅'; st.style.color = 'var(--color-green)'; }
    }

    function _salvarAssinatura(canvas) {
      _state.assinatura = canvas.toDataURL('image/png');
    }

    // =============================================================
    // FINALIZAR
    // =============================================================

    function _finalizar() {
      var turno = document.getElementById('aud-turno')?.value;
      var auditor = document.getElementById('aud-auditor')?.value.trim();
      if (!turno) { _toast('Selecione o turno.', 'error'); return; }
      if (!auditor) { _toast('Informe o nome do auditor.', 'error'); return; }
      var total = AUDITORIA_ESTRUTURA.reduce(function(acc, sec) { return acc + sec.itens.length; }, 0);
      var avaliados = Object.keys(_state.respostas).length;
      if (avaliados < total) {
        if (!confirm('Ainda há ' + (total - avaliados) + ' item(ns) sem avaliação. Deseja finalizar mesmo assim?')) return;
      }
      if (!_state.assinatura) {
        if (!confirm('A assinatura digital não foi capturada. Deseja finalizar sem assinatura?')) return;
      }
      var resultado = _calcularResultado();
      var agora = new Date();
      var registro = {
        id: 'AUD-' + Date.now(),
        dataHora: agora.toLocaleString('pt-BR'),
        data: agora.toLocaleDateString('pt-BR'),
        hora: agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
        turno: turno, auditor: auditor, unidade: 'YUKA',
        respostas: Object.assign({}, _state.respostas),
        naoConformidades: Object.assign({}, _state.naoConformidades),
        observacoes: document.getElementById('aud-observacoes')?.value || '',
        resultado: resultado,
        assinatura: _state.assinatura,
      };
      _state.historico.push(registro);
      try { localStorage.setItem('auditoria_historico_yuka', JSON.stringify(_state.historico)); } catch(e) {}
      _enviarSheets(registro);
      var labels = { aprovado: '✅ Aprovado', ressalvas: '⚠️ Aprovado com Ressalvas', reprovado: '❌ Reprovado' };
      _toast('Auditoria registrada! Resultado: ' + labels[resultado], 'success', 5000);
      setTimeout(function() { _gerarPDFAuditoria(registro); }, 1500);
      _state.respostas = {};
      _state.naoConformidades = {};
      _state.assinatura = null;
      _state.historicoAberto = false;
      _renderTudo();
    }

    // =============================================================
    // MODAL VER
    // =============================================================

    function _abrirVer(auditoria) {
      var modal = document.getElementById('aud-modal-ver');
      var cont = document.getElementById('aud-modal-ver-conteudo');
      if (!modal || !cont) return;
      cont.dataset.audId = auditoria.id;
      var labels = { aprovado: '✅ Aprovado', ressalvas: '⚠️ Aprovado com Ressalvas', reprovado: '❌ Reprovado' };
      var ncs = auditoria.naoConformidades || {};
      var ncIds = Object.keys(ncs);
      var ic = { baixa: '🟢', media: '🟡', alta: '🔴' };
      var ncsHTML = ncIds.length === 0
        ? '<p style="color:var(--color-green);">Nenhuma não conformidade registrada.</p>'
        : ncIds.map(function(id) {
            var nc = ncs[id];
            var label = id;
            for (var i = 0; i < AUDITORIA_ESTRUTURA.length; i++) {
              var f = AUDITORIA_ESTRUTURA[i].itens.find(function(it) { return it.id === id; });
              if (f) { label = AUDITORIA_ESTRUTURA[i].subarea + ' → ' + f.label; break; }
            }
            return '<div style="border:1px solid var(--card-border); border-radius:var(--border-radius-sm); padding:0.7rem; margin-bottom:0.7rem; background:rgba(192,122,108,0.06);">' +
              '<div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; flex-wrap:wrap;">' +
                '<span>' + (ic[nc.criticidade] || '⚠️') + '</span><strong>' + label + '</strong>' +
                (nc.gerarOS ? '<span style="background:var(--color-blue); color:white; font-size:0.72rem; border-radius:10px; padding:1px 7px;">OS Gerada</span>' : '') +
              '</div>' +
              '<p style="font-size:0.85rem; color:var(--text-secondary);"><strong>Ocorrência:</strong> ' + nc.descricao + '</p>' +
              '<p style="font-size:0.85rem; color:var(--text-secondary);"><strong>Ação corretiva:</strong> ' + nc.acao + '</p>' +
              (nc.foto ? '<img src="' + nc.foto + '" style="max-width:100%; max-height:180px; border-radius:var(--border-radius-sm); margin-top:0.5rem; border:1px solid var(--card-border);" alt="Foto">' : '') +
            '</div>';
          }).join('');
      cont.innerHTML = '<div style="padding:0.5rem 0;">' +
        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; margin-bottom:1.4rem;">' +
          '<div><strong>Unidade:</strong> ' + (auditoria.unidade || 'YUKA') + '</div>' +
          '<div><strong>Data/Hora:</strong> ' + auditoria.dataHora + '</div>' +
          '<div><strong>Turno:</strong> ' + auditoria.turno + '</div>' +
          '<div><strong>Auditor:</strong> ' + auditoria.auditor + '</div>' +
          '<div><strong>Resultado:</strong> ' + (labels[auditoria.resultado] || '—') + '</div>' +
          '<div><strong>Não Conformidades:</strong> ' + ncIds.length + '</div>' +
        '</div>' +
        (auditoria.observacoes ? '<div style="margin-bottom:1.4rem;"><strong>Observações:</strong><p style="margin-top:0.4rem; color:var(--text-secondary);">' + auditoria.observacoes + '</p></div>' : '') +
        '<div style="margin-bottom:1.4rem;"><h4 style="margin-bottom:0.7rem;">⚠️ Não Conformidades</h4>' + ncsHTML + '</div>' +
        (auditoria.assinatura ? '<div><h4 style="margin-bottom:0.5rem;">✍️ Assinatura do Auditor</h4><img src="' + auditoria.assinatura + '" style="max-width:100%; border:1px solid var(--card-border); border-radius:var(--border-radius-sm); background:white; padding:0.5rem;" alt="Assinatura"></div>' : '') +
      '</div>';
      modal.style.display = 'flex';
    }

    function _fecharVer() {
      var modal = document.getElementById('aud-modal-ver');
      if (modal) modal.style.display = 'none';
    }

    // =============================================================
    // PDF INDIVIDUAL
    // =============================================================

      var ncs = registro.naoConformidades || {};
      var ncIds = Object.keys(ncs);
      var total = AUDITORIA_ESTRUTURA.reduce(function(acc, sec) { return acc + sec.itens.length; }, 0);
      var conformes = Object.values(registro.respostas || {}).filter(function(v) { return v === 'conforme'; }).length;
      var naoConformes = Object.values(registro.respostas || {}).filter(function(v) { return v === 'nao_conforme'; }).length;
      var naoAvaliados = total - conformes - naoConformes;

      var ncsHTML = ncIds.length === 0

        : ncIds.map(function(id, idx) {
            var nc = ncs[id];
            var label = id;
            for (var i = 0; i < AUDITORIA_ESTRUTURA.length; i++) {

              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e0d8d0;">' +
                '<strong style="font-size:13px;color:#4b433c;">NC #' + (idx+1) + ' — ' + label + '</strong>' +
                '<span style="font-size:12px;font-weight:700;color:' + corCrit + ';">' + (icNC[nc.criticidade] || nc.criticidade) + '</span>' +
              '</div>' +
              '<p style="font-size:12px;color:#5a4e45;margin:0 0 6px;"><strong>Ocorrência:</strong> ' + nc.descricao + '</p>' +
              '<p style="font-size:12px;color:#5a4e45;margin:0 0 8px;"><strong>Ação corretiva:</strong> ' + nc.acao + '</p>' +
              (nc.gerarOS ? '<span style="font-size:11px;background:#3b82f6;color:white;border-radius:10px;padding:2px 8px;display:inline-block;margin-bottom:8px;">🔧 OS Gerada</span>' : '') +
              (nc.foto ? '<div style="margin-top:10px;text-align:center;"><img src="' + nc.foto + '" style="max-width:100%;max-height:260px;border-radius:6px;border:1px solid #e0d8d0;"></div>' : '') +
            '</div>';
          }).join('');

      var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' +
        '* { box-sizing:border-box; margin:0; padding:0; }' +
        'body { font-family:Arial,sans-serif; max-width:820px; margin:0 auto; padding:32px; background:#fff; color:#4b433c; }' +
        '@media print { body { padding:16px; } .no-print { display:none !important; } }' +
        'h1 { font-size:22px; font-weight:800; color:#4b433c; }' +
        'h2 { font-size:15px; font-weight:700; color:#4b433c; margin-bottom:12px; padding-bottom:6px; border-bottom:2px solid #e0d8d0; }' +
        '.kpi { background:#faf8f5; border:1px solid #e0d8d0; border-radius:8px; padding:14px; text-align:center; }' +
        '.kpi-label { font-size:10px; color:#8a8570; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }' +
        '.kpi-value { font-size:26px; font-weight:800; }' +
        '.section { margin-bottom:24px; }' +
        '</style></head><body>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b79b6c;padding-bottom:16px;margin-bottom:24px;">' +
          '<div style="display:flex;align-items:center;gap:16px;">' +
            '<img src="' + LOGO_BASE64 + '" style="height:56px;object-fit:contain;">' +
            '<div><h1>Mamma Mia Control</h1><p style="font-size:13px;color:#8a8570;margin-top:2px;">🧼 Auditoria de Higienização Estrutural — ' + (registro.unidade || 'YUKA') + '</p></div>' +
          '</div>' +
          '<div style="text-align:right;font-size:11px;color:#a09284;">' +
            '<div>Emitido em:</div><div style="font-weight:700;color:#4b433c;margin-top:2px;">' + agora + '</div>' +
            '<div style="margin-top:4px;font-size:13px;font-weight:700;color:' + (corRes[registro.resultado] || '#4b433c') + ';">' + (labelRes[registro.resultado] || '—') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="section"><h2>📋 Informações da Auditoria</h2>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;">' +
            '<div><strong>ID:</strong> ' + registro.id + '</div>' +
            '<div><strong>Data/Hora:</strong> ' + registro.dataHora + '</div>' +
            '<div><strong>Turno:</strong> ' + registro.turno + '</div>' +
            '<div><strong>Auditor:</strong> ' + registro.auditor + '</div>' +
            '<div><strong>Unidade:</strong> ' + (registro.unidade || 'YUKA') + '</div>' +
            '<div><strong>Resultado:</strong> <span style="font-weight:700;color:' + (corRes[registro.resultado] || '#4b433c') + ';">' + (labelRes[registro.resultado] || '—') + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="section"><h2>📊 Resumo dos Itens</h2>' +
          '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">' +
            '<div class="kpi"><div class="kpi-label">Total Itens</div><div class="kpi-value" style="color:#4b433c;">' + total + '</div></div>' +
            '<div class="kpi"><div class="kpi-label">Conformes</div><div class="kpi-value" style="color:#5c7a4e;">' + conformes + '</div></div>' +
            '<div class="kpi"><div class="kpi-label">Não Conformes</div><div class="kpi-value" style="color:#c0402a;">' + naoConformes + '</div></div>' +
            '<div class="kpi"><div class="kpi-label">Não Avaliados</div><div class="kpi-value" style="color:#8a8570;">' + naoAvaliados + '</div></div>' +
          '</div>' +
        '</div>' +
        (registro.observacoes ? '<div class="section"><h2>📝 Observações</h2><p style="font-size:13px;color:#5a4e45;line-height:1.6;">' + registro.observacoes + '</p></div>' : '') +
        '<div class="section"><h2>⚠️ Não Conformidades (' + ncIds.length + ')</h2>' + ncsHTML + '</div>' +
        (registro.assinatura ? '<div class="section" style="page-break-inside:avoid;"><h2>✍️ Assinatura do Auditor</h2>' +

        '</body></html>';

      var janela = window.open('', '_blank');
      janela.document.write(html);

    // =============================================================
    // PDF RESUMO LOCAL
    // =============================================================

    function _gerarPDFResumoLocal(lista) {
      if (!lista || lista.length === 0) { _toast('Nenhum registro para gerar PDF.', 'warning'); return; }
      var agora = new Date().toLocaleString('pt-BR');
      var icones = { aprovado: '✅', ressalvas: '⚠️', reprovado: '❌' };
      var blocos = lista.map(function(a, idx) {
        var nc = Object.keys(a.naoConformidades || {}).length;
        var altas = Object.values(a.naoConformidades || {}).filter(function(n) { return n.criticidade === 'alta'; }).length;
        var total = AUDITORIA_ESTRUTURA.reduce(function(acc, sec) { return acc + sec.itens.length; }, 0);
        var conformes = Object.values(a.respostas || {}).filter(function(v) { return v === 'conforme'; }).length;
        var res = a.resultado || '';
        return '<div style="border:1px solid #e0d8d0;border-radius:8px;padding:16px;margin-bottom:16px;background:#faf8f5;page-break-inside:avoid;">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #e0d8d0;">' +
            '<div><strong style="font-size:13px;color:#4b433c;">#' + (idx+1) + ' — ' + (a.dataHora || '—') + '</strong><br><span style="font-size:12px;color:#7b6f63;">Turno: ' + (a.turno || '—') + ' | Auditor: ' + (a.auditor || '—') + '</span></div>' +
            '<div style="font-size:20px;">' + (icones[res] || '—') + '</div>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;">' +
            '<div style="background:#fff;border:1px solid #e0d8d0;border-radius:6px;padding:8px;text-align:center;"><div style="font-size:10px;color:#8a8570;text-transform:uppercase;">Conformes</div><div style="font-size:18px;font-weight:700;color:#5c7a4e;">' + conformes + '</div></div>' +
            '<div style="background:#fff;border:1px solid #e0d8d0;border-radius:6px;padding:8px;text-align:center;"><div style="font-size:10px;color:#8a8570;text-transform:uppercase;">N/C Total</div><div style="font-size:18px;font-weight:700;color:#c0402a;">' + nc + '</div></div>' +
            '<div style="background:#fff;border:1px solid #e0d8d0;border-radius:6px;padding:8px;text-align:center;"><div style="font-size:10px;color:#8a8570;text-transform:uppercase;">N/C Altas</div><div style="font-size:18px;font-weight:700;color:#c0402a;">' + altas + '</div></div>' +
            '<div style="background:#fff;border:1px solid #e0d8d0;border-radius:6px;padding:8px;text-align:center;"><div style="font-size:10px;color:#8a8570;text-transform:uppercase;">Total Itens</div><div style="font-size:18px;font-weight:700;color:#4b433c;">' + total + '</div></div>' +
          '</div>' +
          (a.observacoes ? '<p style="font-size:11px;color:#7b6f63;margin:0;"><strong>Observações:</strong> ' + a.observacoes + '</p>' : '') +
        '</div>';
      }).join('');

      var html = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
        '<style>body{font-family:Arial,sans-serif;max-width:820px;margin:0 auto;padding:28px;background:#fff;color:#4b433c;}@media print{body{padding:0;}.no-print{display:none;}}</style>' +
        '</head><body>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b79b6c;padding-bottom:14px;margin-bottom:20px;">' +
          '<div style="display:flex;align-items:center;gap:16px;">' +
            '<img src="' + LOGO_BASE64 + '" style="height:48px;object-fit:contain;">' +
            '<div><h1 style="font-size:20px;font-weight:800;margin:0;">Mamma Mia Control</h1><p style="font-size:13px;color:#8a8570;margin:2px 0 0;">🧼 Relatório de Auditorias — YUKA</p></div>' +
          '</div>' +
          '<div style="text-align:right;font-size:11px;color:#a09284;"><div>Emitido em: <strong style="color:#4b433c;">' + agora + '</strong></div><div style="margin-top:4px;">' + lista.length + ' auditoria(s)</div></div>' +
        '</div>' +
        blocos +
        '<div style="margin-top:24px;padding-top:12px;border-top:1px solid #e0d8d0;font-size:10px;color:#a09284;text-align:center;">Mamma Mia Control — Gestão Inteligente de Operações • © 2026 Mamma Mia Salgados</div>' +
        '<div class="no-print" style="text-align:center;margin-top:24px;"><button onclick="window.print()" style="background:#b79b6c;color:white;border:none;border-radius:8px;padding:12px 32px;font-size:15px;cursor:pointer;font-weight:700;">🖨️ Imprimir / Salvar PDF</button></div>' +
        '</body></html>';

      var janela = window.open('', '_blank');
      janela.document.write(html);
      janela.document.close();
    }

    // =============================================================
    // SHEETS
    // =============================================================

    async function _enviarSheets(registro) {
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(registro)
        });
      } catch(e) {
        console.error('Erro ao enviar para Sheets:', e);
      }
    }

    // =============================================================
    // UTILS
    // =============================================================

    function _toast(msg, tipo, duracao) {
      tipo = tipo || 'info';
      duracao = duracao || 3500;
      var cores = { success: 'var(--color-green)', error: 'var(--color-red)', info: 'var(--color-blue)', warning: 'var(--color-orange)' };
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;z-index:99999;background:var(--card-bg);border:1px solid ' + cores[tipo] + ';border-left:4px solid ' + cores[tipo] + ';border-radius:var(--border-radius-md);padding:0.9rem 1.25rem;box-shadow:0 8px 24px rgba(0,0,0,0.12);max-width:360px;font-family:var(--font-main);font-size:0.9rem;color:var(--text-primary);';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, duracao);
    }

    initAuditoria();
  </script>
