<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --gold-suave: #e8d9b8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden; /* a rolagem acontece dentro da sidebar e do iframe, não na página toda */
    }

    .shell { display: flex; flex-direction: column; height: 100%; }

    header {
      background: var(--gold-suave);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--gold);
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 800; }
    header p { margin: 0.1rem 0 0; font-size: 0.72rem; color: rgba(75,67,60,0.75); }

    .corpo { display: flex; flex: 1; min-height: 0; }

    /* ---------- Sidebar (menu fixo) ---------- */
    .sidebar {
      width: 230px;
      flex-shrink: 0;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0.6rem;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.6rem;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.15rem;
      border: 1px solid transparent;
    }
    .item:hover { background: rgba(183,155,108,0.1); }
    .item.ativo { background: rgba(183,155,108,0.18); border-color: var(--gold); }
    .item-icone { font-size: 1.05rem; width: 1.4rem; text-align: center; flex-shrink: 0; }
    .item-nova-aba { margin-left: auto; font-size: 0.68rem; color: var(--text-muted); flex-shrink: 0; }

    /* Resumo do Kanban, dentro do próprio item da sidebar */
    .kanban-stats { display: flex; gap: 0.3rem; margin: 0.3rem 0 0.5rem; padding: 0 0.1rem; }
    .kanban-stat { flex: 1; text-align: center; border-radius: 8px; padding: 0.3rem 0.1rem; background: rgba(0,0,0,0.03); }
    .kanban-stat-numero { font-size: 1rem; font-weight: 800; line-height: 1.1; }
    .kanban-stat-rotulo { font-size: 0.52rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .kanban-stat-a-fazer .kanban-stat-numero { color: #c08f3d; }
    .kanban-stat-em-andamento .kanban-stat-numero { color: #b89323; }
    .kanban-stat-concluido .kanban-stat-numero { color: #74805c; }

    /* ---------- Painel principal (iframe) ---------- */
    .painel { flex: 1; min-width: 0; position: relative; background: var(--bg); }
    .painel iframe { width: 100%; height: 100%; border: none; display: block; }
    .painel-vazio {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 2rem;
    }

    /* ---------- Mobile: sidebar vira uma faixa horizontal no topo ---------- */
    @media (max-width: 760px) {
      .corpo { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .painel { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Painel Qualidade</h1>
      <p>De onde você lança os dados — o Mamma Mia Control só exibe.</p>
    </header>

    <div class="corpo">
      <nav class="sidebar" id="sidebar">
        <div class="kanban-stats" id="kanban-stats">
          <div class="kanban-stat kanban-stat-a-fazer"><div class="kanban-stat-numero">–</div><div class="kanban-stat-rotulo">A Fazer</div></div>
          <div class="kanban-stat kanban-stat-em-andamento"><div class="kanban-stat-numero">–</div><div class="kanban-stat-rotulo">Fazendo</div></div>
          <div class="kanban-stat kanban-stat-concluido"><div class="kanban-stat-numero">–</div><div class="kanban-stat-rotulo">Feito</div></div>
        </div>

        <a class="item ativo" data-src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=kanban">
          <span class="item-icone">🗂️</span> Kanban de Atividades
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbxg34g07LP6huO-f9AA4FCyOrg-xgKRTheRWxKrZyJfiTlj3qJCFZCzkl7drhs5jv3b/exec?tela=compras">
          <span class="item-icone">🛒</span> Compras
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=insumos">
          <span class="item-icone">📦</span> Insumos Críticos
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=auditoria">
          <span class="item-icone">🧼</span> Auditoria
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=dedetizacao">
          <span class="item-icone">🐜</span> Dedetização
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbxN_cFnGJpZgwVaCAegqB0HwrBsw_wKQd56wXyeq3RK5LZbumHrFaudxu9VjQMPBuOauQ/exec">
          <span class="item-icone">🔧</span> Ordens de Serviço
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=avisos">
          <span class="item-icone">📌</span> Avisos
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=pipa">
          <span class="item-icone">🚚</span> Caminhão Pipa
        </a>
        <a class="item" data-src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=higienizacao">
          <span class="item-icone">🧴</span> Higienização de Motores
        </a>

        <!-- Refeitório (repo separado) e VTO (site externo) — não dá pra
             garantir que aceitem ficar dentro do iframe (podem bloquear
             por política própria de segurança), então abrem numa aba
             nova em vez de arriscar um painel em branco. -->
        <a class="item" href="https://script.google.com/macros/s/AKfycbwAY8w7ZffliLuNu19FKOCu0kyTSdXCyUWD8rQTdN5PgPJ5jcuhG3ThjA96kN8_jn9ASQ/exec" target="_blank" rel="noopener">
          <span class="item-icone">🍽️</span> Refeitório <span class="item-nova-aba">↗</span>
        </a>
        <a class="item" href="https://verificacao-operacional-mammamia.vercel.app/" target="_blank" rel="noopener">
          <span class="item-icone">🔍</span> VTO <span class="item-nova-aba">↗</span>
        </a>
      </nav>

      <div class="painel">
        <iframe id="painel-iframe" src="https://script.google.com/macros/s/AKfycbzAA1-03ZTdzf2c23tQi6uxuM7gHV-bqcBa8wuuwkrzNhzW5vVkEDC1Jbfu15ClFnSmtg/exec?tela=kanban"></iframe>
      </div>
    </div>
  </div>

  <script>
    // Clicar num item da sidebar troca o src do iframe em vez de navegar
    // a página toda — "Refeitório" e "VTO" são exceção (abrem em nova
    // aba, ver comentário no HTML). Ver
    // docs/superpowers/specs/2026-10-02-painel-qualidade-shell-iframe-design.md.
    var iframe = document.getElementById('painel-iframe');
    document.querySelectorAll('.item[data-src]').forEach(function (item) {
      item.addEventListener('click', function (ev) {
        ev.preventDefault();
        document.querySelectorAll('.item').forEach(function (i) { i.classList.remove('ativo'); });
        item.classList.add('ativo');
        iframe.src = item.getAttribute('data-src');
      });
    });

    // Resumo ao vivo do Kanban (contagem por coluna), mostrado em cima
    // da lista da sidebar — mesmo backend/ação que Kanban.html já usa
    // (avisos-appscript, ?dados=kanban). Se falhar, os "–" ficam no
    // lugar dos números, sem travar o resto da sidebar.
    var KANBAN_EXEC_URL = 'https://script.google.com/macros/s/AKfycbzHvvPZzBDSB730gShVCl7CPQb23h37w8k8B-cY8n1RI-NkBJzp0eUP5m-rbtj3nGdwpw/exec';

    function carregarResumoKanban() {
      fetch(KANBAN_EXEC_URL + '?dados=kanban', { cache: 'no-store' })
        .then(function (resposta) {
          if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
          return resposta.json();
        })
        .then(function (resultado) {
          if (!resultado.ok) throw new Error(resultado.erro || 'Erro desconhecido');
          var cards = resultado.cards || [];
          var contagem = { 'A Fazer': 0, 'Em Andamento': 0, 'Concluído': 0 };
          cards.forEach(function (c) {
            if (contagem.hasOwnProperty(c.coluna)) contagem[c.coluna]++;
          });
          var stats = document.querySelectorAll('#kanban-stats .kanban-stat-numero');
          stats[0].textContent = contagem['A Fazer'];
          stats[1].textContent = contagem['Em Andamento'];
          stats[2].textContent = contagem['Concluído'];
        })
        .catch(function (erro) {
          console.error('[MENU]', erro);
        });
    }

    carregarResumoKanban();
  </script>
</body>
</html>
