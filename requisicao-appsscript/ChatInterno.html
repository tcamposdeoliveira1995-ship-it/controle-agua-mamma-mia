<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --green: #8f9b72;
      --red: #c07a6c;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; flex-direction: column; }

    header {
      background: var(--text);
      color: #fff;
      padding: 1rem 1.1rem;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; color: #d8d2c6; }
    .link-menu { display: inline-block; margin-bottom: 0.5rem; font-size: 0.78rem; color: #d8d2c6; text-decoration: none; }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .config-nome {
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .config-nome label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
    .config-nome input {
      width: 100%;
      font-size: 1rem;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
    }
    .config-nome button {
      margin-top: 0.6rem;
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: none;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .lista-mensagens {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem;
    }
    .estado-vazio {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }

    .msg {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.6rem;
      max-width: 85%;
    }
    .msg-topo { display: flex; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.2rem; }
    .msg-nome { font-weight: 700; font-size: 0.82rem; color: var(--gold); }
    .msg-hora { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
    .msg-texto { font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }

    .compositor {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      padding: 0.8rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
    }
    .compositor textarea {
      flex: 1;
      resize: none;
      font-size: 0.95rem;
      font-family: inherit;
      padding: 0.6rem 0.7rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      max-height: 5rem;
    }
    .compositor button {
      flex-shrink: 0;
      padding: 0 1.1rem;
      border-radius: 10px;
      border: none;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .compositor button:disabled { opacity: 0.6; }

    .alerta {
      background: #fbe9e7;
      border: 1px solid var(--red);
      color: #8c3f33;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.82rem;
      margin: 0 1rem 0.6rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="link-menu" href="https://script.google.com/macros/s/AKfycby-80t2GWkm9ZFjgEh93mkCzUHBJpKKFXFSvqvT9Scx3SbhC94iUxG_hN55BsyNrEaEGA/exec">‹ Menu</a>
    <h1>💬 Chat da Equipe</h1>
    <p>Requisição MP e Recheios · Mamma Mia</p>
  </header>

  <main>
    <div class="config-nome" id="config-nome">
      <label for="campo-meu-nome">Como quer aparecer pro time?</label>
      <input type="text" id="campo-meu-nome" placeholder="Seu nome">
      <button id="btn-salvar-nome" type="button">Entrar no chat</button>
    </div>

    <div class="lista-mensagens" id="lista-mensagens" style="display:none;">
      <div class="estado-vazio" id="estado-carregando">Carregando conversa…</div>
    </div>

    <div id="area-erro"></div>

    <div class="compositor" id="compositor" style="display:none;">
      <textarea id="campo-mensagem" placeholder="Escreva uma mensagem..." rows="1"></textarea>
      <button id="btn-enviar" type="button">Enviar</button>
    </div>
  </main>

  <script>
    var CHAVE_MEU_NOME = 'chat_meu_nome';
    var INTERVALO_ATUALIZACAO_MS = 8000; // confere mensagens novas a cada 8s
    var idsExibidos = {};

    function escaparHtml(texto) {
      var div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }

    function iniciar() {
      var nomeSalvo = localStorage.getItem(CHAVE_MEU_NOME);
      if (nomeSalvo) {
        mostrarChat();
      }
      document.getElementById('btn-salvar-nome').addEventListener('click', salvarNome);
      document.getElementById('campo-meu-nome').addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter') salvarNome();
      });
      document.getElementById('btn-enviar').addEventListener('click', enviarMensagem);
      document.getElementById('campo-mensagem').addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter' && !evento.shiftKey) {
          evento.preventDefault();
          enviarMensagem();
        }
      });
    }

    function salvarNome() {
      var nome = document.getElementById('campo-meu-nome').value.trim();
      if (!nome) return;
      localStorage.setItem(CHAVE_MEU_NOME, nome);
      mostrarChat();
    }

    function mostrarChat() {
      document.getElementById('config-nome').style.display = 'none';
      document.getElementById('lista-mensagens').style.display = 'block';
      document.getElementById('compositor').style.display = 'flex';
      carregarMensagens();
      setInterval(carregarMensagens, INTERVALO_ATUALIZACAO_MS);
    }

    function carregarMensagens() {
      google.script.run
        .withSuccessHandler(renderizarMensagens)
        .withFailureHandler(function (erro) {
          console.error(erro);
        })
        .listarMensagensChat();
    }

    function renderizarMensagens(mensagens) {
      mensagens = mensagens || [];
      var container = document.getElementById('lista-mensagens');

      if (mensagens.length === 0) {
        container.innerHTML = '<div class="estado-vazio">Nenhuma mensagem ainda. Comece a conversa!</div>';
        idsExibidos = {};
        return;
      }

      // Só reconstrói o HTML se a quantidade de mensagens mudou desde a
      // última checagem — evita "piscar"/perder a posição de rolagem a
      // cada 8s quando não chegou nada novo.
      var idsAtuais = {};
      mensagens.forEach(function (m) { idsAtuais[m.id] = true; });
      var mudou = Object.keys(idsAtuais).length !== Object.keys(idsExibidos).length ||
        mensagens.some(function (m) { return !idsExibidos[m.id]; });

      if (!mudou) return;

      var estavaPertoDoFim = (container.scrollHeight - container.scrollTop - container.clientHeight) < 80;

      container.innerHTML = mensagens.map(function (m) {
        return '<div class="msg">' +
          '<div class="msg-topo">' +
            '<span class="msg-nome">' + escaparHtml(m.nome) + '</span>' +
            '<span class="msg-hora">' + escaparHtml(m.dataHora) + '</span>' +
          '</div>' +
          '<div class="msg-texto">' + escaparHtml(m.mensagem) + '</div>' +
        '</div>';
      }).join('');

      idsExibidos = idsAtuais;

      if (estavaPertoDoFim) {
        container.scrollTop = container.scrollHeight;
      }
    }

    function enviarMensagem() {
      var campo = document.getElementById('campo-mensagem');
      var texto = campo.value.trim();
      var meuNome = localStorage.getItem(CHAVE_MEU_NOME) || '';
      var botao = document.getElementById('btn-enviar');
      var areaErro = document.getElementById('area-erro');

      areaErro.innerHTML = '';
      if (!texto) return;

      botao.disabled = true;

      google.script.run
        .withSuccessHandler(function () {
          botao.disabled = false;
          campo.value = '';
          carregarMensagens();
        })
        .withFailureHandler(function (erro) {
          botao.disabled = false;
          areaErro.innerHTML = '<div class="alerta">' + escaparHtml(erro.message || String(erro)) + '</div>';
        })
        .enviarMensagemChat(meuNome, texto);
    }

    iniciar();
  </script>
</body>
</html>
