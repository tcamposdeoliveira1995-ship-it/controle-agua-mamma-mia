<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --green: #8f9b72;
      --red: #c07a6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 1rem 1.1rem;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; color: #d8d2c6; }
    .link-menu { display: inline-block; margin-bottom: 0.5rem; font-size: 0.78rem; color: #d8d2c6; text-decoration: none; }
    main { padding: 1rem; max-width: 480px; margin: 0 auto; padding-bottom: 3rem; }

    .estado-carregando {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }

    .form-secao { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }
    .form-secao label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin: 0.9rem 0 0.35rem; }
    .form-secao label:first-child { margin-top: 0; }
    .obrigatorio { color: var(--red); }
    textarea, select, input[type="text"] {
      width: 100%;
      font-size: 1rem;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 70px; resize: vertical; }

    .campo-outro { margin-top: 0.5rem; display: none; }
    .campo-outro.visivel { display: block; }

    .catalogo-titulo {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 0.6rem;
    }
    .catalogo-contador {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    input[type="search"] {
      width: 100%;
      font-size: 1rem;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      margin-bottom: 0.8rem;
    }

    .categoria-titulo {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--gold);
      margin: 1.1rem 0 0.5rem;
    }
    .categoria-titulo:first-of-type { margin-top: 0; }

    .produto-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
    }
    .produto-linha:last-child { border-bottom: none; }
    .produto-nome { font-size: 0.88rem; line-height: 1.3; flex: 1; }
    .produto-qtd {
      width: 5rem;
      flex-shrink: 0;
      font-size: 1rem;
      padding: 0.5rem 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .produto-qtd.tem-valor { border-color: var(--green); font-weight: 700; color: var(--green); }
    .produto-linha.oculta { display: none; }

    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-primario { background: var(--green); color: #fff; margin-top: 0.4rem; }
    .btn-primario:disabled { opacity: 0.6; }

    .alerta {
      background: #fbe9e7;
      border: 1px solid var(--red);
      color: #8c3f33;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .sucesso { text-align: center; padding: 3rem 1rem; }
    .sucesso .icone { font-size: 3rem; margin-bottom: 0.5rem; }
    .sucesso h2 { margin: 0 0 0.3rem; font-size: 1.15rem; }
    .sucesso p { color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <a class="link-menu" href="?">‹ Menu</a>
    <h1>📋 Abrir Requisição</h1>
    <p>Requisição MP e Recheios · Mamma Mia</p>
  </header>

  <main id="app">
    <div class="estado-carregando" id="tela-carregando">Carregando catálogo…</div>
  </main>

  <script>
    var DADOS = null; // { catalogo, opcoesUnidade, opcoesSetor, opcoesTipoItem }

    function iniciar() {
      google.script.run
        .withSuccessHandler(function (dados) {
          DADOS = dados;
          renderizarFormulario();
        })
        .withFailureHandler(mostrarErroFatal)
        .obterDadosAberturaRequisicao();
    }

    function mostrarErroFatal(erro) {
      document.getElementById('app').innerHTML =
        '<div class="alerta">' + escaparHtml(erro.message || String(erro)) + '</div>';
    }

    function escaparHtml(texto) {
      var div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }

    function opcoesSelect(lista, comPlaceholder) {
      var html = comPlaceholder ? '<option value="">Selecione...</option>' : '';
      lista.forEach(function (op) {
        html += '<option value="' + escaparHtml(op) + '">' + escaparHtml(op) + '</option>';
      });
      return html;
    }

    function renderizarCatalogo() {
      var html = '';
      Object.keys(DADOS.catalogo).forEach(function (categoria) {
        html += '<div class="categoria-titulo">' + escaparHtml(categoria) + '</div>';
        DADOS.catalogo[categoria].forEach(function (produto) {
          html +=
            '<div class="produto-linha" data-nome="' + escaparHtml(produto.toLowerCase()) + '">' +
              '<span class="produto-nome">' + escaparHtml(produto) + '</span>' +
              '<input type="number" class="produto-qtd" min="0" step="any" placeholder="0" data-produto="' + escaparHtml(produto) + '">' +
            '</div>';
        });
      });
      return html;
    }

    function renderizarFormulario() {
      var app = document.getElementById('app');
      app.innerHTML =
        '<div class="form-secao">' +
          '<label for="campo-requisitante">Nome do requisitante <span class="obrigatorio">*</span></label>' +
          '<input type="text" id="campo-requisitante" placeholder="Seu nome">' +

          '<label for="campo-unidade">Unidade solicitante <span class="obrigatorio">*</span></label>' +
          '<select id="campo-unidade">' + opcoesSelect(DADOS.opcoesUnidade, true) + '</select>' +

          '<label for="campo-setor">Setor solicitante <span class="obrigatorio">*</span></label>' +
          '<select id="campo-setor">' + opcoesSelect(DADOS.opcoesSetor, true) + '</select>' +
          '<input type="text" class="campo-outro" id="campo-setor-outro" placeholder="Qual setor?">' +

          '<label for="campo-tipo">Tipo de item requisitado <span class="obrigatorio">*</span></label>' +
          '<select id="campo-tipo">' + opcoesSelect(DADOS.opcoesTipoItem, true) + '</select>' +
          '<input type="text" class="campo-outro" id="campo-tipo-outro" placeholder="Qual tipo?">' +

          '<label for="campo-finalidade">Finalidade da requisição <span class="obrigatorio">*</span></label>' +
          '<textarea id="campo-finalidade" placeholder="Pra que os itens vão ser usados?"></textarea>' +
        '</div>' +

        '<div class="form-secao">' +
          '<div class="catalogo-titulo">Itens do catálogo <span class="catalogo-contador" id="contador-itens">(0 selecionados)</span></div>' +
          '<input type="search" id="campo-filtro" placeholder="🔎 Buscar produto...">' +
          '<div id="lista-catalogo">' + renderizarCatalogo() + '</div>' +
        '</div>' +

        '<div id="area-erro"></div>' +
        '<button class="btn btn-primario" id="btn-enviar">Abrir Requisição 📦</button>';

      document.getElementById('campo-setor').addEventListener('change', function () {
        mostrarOuEsconderOutro('campo-setor', 'campo-setor-outro');
      });
      document.getElementById('campo-tipo').addEventListener('change', function () {
        mostrarOuEsconderOutro('campo-tipo', 'campo-tipo-outro');
      });
      document.getElementById('campo-filtro').addEventListener('input', filtrarCatalogo);
      document.getElementById('btn-enviar').addEventListener('click', enviarRequisicao);

      Array.prototype.forEach.call(document.querySelectorAll('.produto-qtd'), function (input) {
        input.addEventListener('input', function () {
          input.classList.toggle('tem-valor', Number(input.value) > 0);
          atualizarContadorItens();
        });
      });
    }

    function mostrarOuEsconderOutro(idSelect, idCampoOutro) {
      var select = document.getElementById(idSelect);
      document.getElementById(idCampoOutro).classList.toggle('visivel', select.value === 'Outro');
    }

    function filtrarCatalogo() {
      var termo = document.getElementById('campo-filtro').value.trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('.produto-linha'), function (linha) {
        var bate = !termo || linha.getAttribute('data-nome').indexOf(termo) !== -1;
        linha.classList.toggle('oculta', !bate);
      });
    }

    function atualizarContadorItens() {
      var total = coletarItens().length;
      document.getElementById('contador-itens').textContent = '(' + total + ' selecionado' + (total === 1 ? '' : 's') + ')';
    }

    function coletarItens() {
      var itens = [];
      Array.prototype.forEach.call(document.querySelectorAll('.produto-qtd'), function (input) {
        var quantidade = Number(input.value);
        if (quantidade > 0) {
          itens.push({ produto: input.getAttribute('data-produto'), quantidade: quantidade });
        }
      });
      return itens;
    }

    function valorComOutro(idSelectOuTexto, idCampoOutro) {
      var principal = document.getElementById(idSelectOuTexto).value;
      if (principal !== 'Outro') return principal;
      return document.getElementById(idCampoOutro).value.trim();
    }

    function enviarRequisicao() {
      var areaErro = document.getElementById('area-erro');
      var botao = document.getElementById('btn-enviar');
      areaErro.innerHTML = '';

      var dados = {
        requisitante: document.getElementById('campo-requisitante').value.trim(),
        unidade: document.getElementById('campo-unidade').value,
        setor: valorComOutro('campo-setor', 'campo-setor-outro'),
        tipo: valorComOutro('campo-tipo', 'campo-tipo-outro'),
        finalidade: document.getElementById('campo-finalidade').value.trim(),
        itens: coletarItens(),
      };

      var CAMPOS_OBRIGATORIOS = [
        ['requisitante', 'Nome do requisitante'],
        ['unidade', 'Unidade solicitante'],
        ['setor', 'Setor solicitante'],
        ['tipo', 'Tipo de item requisitado'],
        ['finalidade', 'Finalidade da requisição'],
      ];
      for (var i = 0; i < CAMPOS_OBRIGATORIOS.length; i++) {
        if (!dados[CAMPOS_OBRIGATORIOS[i][0]]) {
          areaErro.innerHTML = '<div class="alerta">Preencha o campo "' + escaparHtml(CAMPOS_OBRIGATORIOS[i][1]) + '" antes de enviar.</div>';
          return;
        }
      }
      if (dados.itens.length === 0) {
        areaErro.innerHTML = '<div class="alerta">Selecione ao menos um item com quantidade antes de enviar.</div>';
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Enviando...';

      google.script.run
        .withSuccessHandler(renderizarSucesso)
        .withFailureHandler(function (erro) {
          botao.disabled = false;
          botao.textContent = 'Abrir Requisição 📦';
          areaErro.innerHTML = '<div class="alerta">' + escaparHtml(erro.message || String(erro)) + '</div>';
        })
        .abrirRequisicao(dados);
    }

    function renderizarSucesso(resultado) {
      document.getElementById('app').innerHTML =
        '<div class="sucesso">' +
          '<div class="icone">✅</div>' +
          '<h2>' + escaparHtml(resultado.id) + ' aberta</h2>' +
          '<p>O almoxarifado já foi avisado.</p>' +
        '</div>';
      setTimeout(iniciar, 2200);
    }

    iniciar();
  </script>
</body>
</html>
