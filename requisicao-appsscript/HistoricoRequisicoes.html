<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f3ee;
      --card-bg: #ffffff;
      --border: #e8ddd0;
      --text: #4b433c;
      --text-muted: #8a8570;
      --gold: #b79b6c;
      --green: #8f9b72;
      --red: #c07a6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 1rem 1.1rem;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; color: #d8d2c6; }
    .link-menu { display: inline-block; margin-bottom: 0.5rem; font-size: 0.78rem; color: #d8d2c6; text-decoration: none; }
    main { padding: 1rem; max-width: 480px; margin: 0 auto; padding-bottom: 3rem; }

    .estado-carregando, .estado-vazio {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }

    input[type="search"] {
      width: 100%;
      font-size: 1rem;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      margin-bottom: 0.9rem;
    }
    .contador { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.6rem; }

    .req-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
    }
    .req-card.oculto { display: none; }
    .req-card-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .req-card-id { font-weight: 700; font-size: 1rem; }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      color: #fff;
      white-space: nowrap;
      background: var(--green);
    }
    .req-card-setor { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .req-card-itens { font-size: 0.82rem; color: var(--text); line-height: 1.4; white-space: pre-line; }
    .req-card-entrega {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <header>
    <a class="link-menu" href="https://script.google.com/macros/s/AKfycby-80t2GWkm9ZFjgEh93mkCzUHBJpKKFXFSvqvT9Scx3SbhC94iUxG_hN55BsyNrEaEGA/exec">‹ Menu</a>
    <h1>📜 Histórico de Requisições</h1>
    <p>Requisição MP e Recheios · Mamma Mia</p>
  </header>

  <main id="app">
    <div class="estado-carregando" id="tela-carregando">Carregando histórico…</div>
  </main>

  <script>
    var TODAS = [];

    function iniciar() {
      google.script.run
        .withSuccessHandler(function (fechadas) {
          TODAS = fechadas || [];
          renderizar();
        })
        .withFailureHandler(mostrarErroFatal)
        .listarRequisicoesFechadas();
    }

    function mostrarErroFatal(erro) {
      document.getElementById('app').innerHTML =
        '<div class="estado-vazio">' + escaparHtml(erro.message || String(erro)) + '</div>';
    }

    function escaparHtml(texto) {
      var div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }

    function renderizar() {
      var app = document.getElementById('app');

      if (TODAS.length === 0) {
        app.innerHTML = '<div class="estado-vazio">Nenhuma requisição concluída ainda.</div>';
        return;
      }

      var html =
        '<input type="search" id="campo-busca" placeholder="🔎 Buscar por ID, requisitante, setor ou item...">' +
        '<div class="contador" id="contador">' + TODAS.length + ' requisição(ões) concluída(s)</div>' +
        '<div id="lista"></div>';
      app.innerHTML = html;

      renderizarLista(TODAS);

      document.getElementById('campo-busca').addEventListener('input', function () {
        var termo = this.value.trim().toLowerCase();
        if (!termo) { renderizarLista(TODAS); return; }

        var filtradas = TODAS.filter(function (req) {
          var alvo = [req.id, req.requisitante, req.unidade, req.setor, req.tipo, req.itens, req.entreguePor]
            .join(' ')
            .toLowerCase();
          return alvo.indexOf(termo) !== -1;
        });
        renderizarLista(filtradas);
      });
    }

    function renderizarLista(lista) {
      var container = document.getElementById('lista');
      document.getElementById('contador').textContent = lista.length + ' requisição(ões) encontrada(s)';

      if (lista.length === 0) {
        container.innerHTML = '<div class="estado-vazio">Nenhuma requisição bate com a busca.</div>';
        return;
      }

      var html = '';
      lista.forEach(function (req) {
        html +=
          '<div class="req-card">' +
            '<div class="req-card-topo">' +
              '<span class="req-card-id">' + escaparHtml(req.id) + '</span>' +
              '<span class="badge">CONCLUÍDA</span>' +
            '</div>' +
            '<div class="req-card-setor">' + escaparHtml(req.requisitante || '-') + ' · ' + escaparHtml(req.unidade || '-') + ' · ' + escaparHtml(req.setor || '-') + '</div>' +
            '<div class="req-card-itens">' + escaparHtml(req.itens || '') + '</div>' +
            (req.entreguePor
              ? '<div class="req-card-entrega">✅ Entregue por <b>' + escaparHtml(req.entreguePor) + '</b>' +
                (req.dataEntrega ? ' em ' + escaparHtml(req.dataEntrega) : '') +
                (req.obsEntrega ? '<br>📝 ' + escaparHtml(req.obsEntrega) : '') +
                '</div>'
              : '') +
          '</div>';
      });
      container.innerHTML = html;
    }

    iniciar();
  </script>
</body>
</html>
